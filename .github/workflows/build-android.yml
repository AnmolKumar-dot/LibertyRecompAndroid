name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK, platform 35 and NDK r29
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "ndk;29.0.14206865"

      - name: Tool versions
        run: |
          cmake --version
          ninja --version
          python --version

      - name: Repo setup (submodules, patches, vcpkg)
        run: python tools/setup_repo.py

      - name: Driver proxy
        run: bash os/android/scripts/build_driver_proxy.sh

      - name: Native build
        env:
          STRIP: "1"
        run: bash os/android/scripts/build_native.sh

      - name: Package APK
        run: |
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: liberty-apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: os/android/app/build/outputs/apk/debug/app-debug.apk
